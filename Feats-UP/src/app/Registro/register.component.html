<div class="registro-container">
  <div class="card">
    <a routerLink="/" class="volver">← Volver</a>
    <h2 class="titulo">Crear Cuenta</h2>
    <p class="subtitulo">Completa tus datos para registrarte</p>

    <form>
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Ingresa tu nombre" />

      <label for="apellidos">Apellidos</label>
      <input type="text" id="apellidos" placeholder="Ingresa tus apellidos" />

      <label for="correo">Correo Electrónico</label>
      <input type="email" id="correo" placeholder="correo@ejemplo.com" />

      <label for="fecha">Fecha de Nacimiento</label>
      <input type="date" id="fecha" />

      <label for="celular">Número Celular</label>
      <input type="tel" id="celular" placeholder="10 dígitos" maxlength="10" />

      <button type="submit" class="btn-crear">Crear Mi Cuenta</button>
    </form>
  </div>
</div>
