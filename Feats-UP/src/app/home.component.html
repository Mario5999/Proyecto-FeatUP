<div class="home-container">
  <header class="encabezado">
    <h1>Bienvenido, {{ usuario.nombre }}</h1>
    <button class="btn-cerrar" (click)="cerrarSesion()" routerLink="/login">Cerrar Sesión</button>
  </header>

  <section class="tarjetas">
    <div class="card">
      <div class="icono">📅</div>
      <div class="titulo">Total Reservaciones</div>
      <div class="valor">{{ totalReservaciones }}</div>
    </div>

    <div class="card">
      <div class="icono">👤</div>
      <div class="titulo">Usuario</div>
      <div class="valor">{{ usuario.correo }}</div>
    </div>
  </section>

  <section class="acciones">
    <button class="btn-verde" (click)="crearReservacion()">Nueva Reservación</button>
  </section>

  <section class="estado">
    <h3>Sin Reservaciones</h3>
    <p>Aún no tienes ninguna reservación registrada</p>
    <button class="btn-verde" (click)="crearReservacion()">Crear tu Primera Reservación</button>
  </section>
</div>
