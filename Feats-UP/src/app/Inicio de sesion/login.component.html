<div class="login-container">
  <div class="card">
    <a routerLink="/" class="volver">← Volver</a>
    <h2 class="titulo">Iniciar Sesión</h2>
    <p class="subtitulo">Accede a tu cuenta</p>

    <form [formGroup]="form" (ngSubmit)="ingresar()">
      <label for="correo">Correo Electrónico</label>
      <input id="correo" type="email" formControlName="correo" placeholder="correo@ejemplo.com" />
      <div class="error" *ngIf="form.get('correo')?.touched && form.get('correo')?.invalid">
        <small *ngIf="form.get('correo')?.errors?.['required']">Este campo es obligatorio</small>
        <small *ngIf="form.get('correo')?.errors?.['email']">Formato de correo inválido</small>
      </div>

      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" formControlName="nombre" placeholder="Tu nombre" />
      <div class="error" *ngIf="form.get('nombre')?.touched && form.get('nombre')?.invalid">
        <small>Este campo es obligatorio</small>
      </div>

      <label for="apellidos">Apellidos</label>
      <input id="apellidos" type="text" formControlName="apellidos" placeholder="Tus apellidos" />
      <div class="error" *ngIf="form.get('apellidos')?.touched && form.get('apellidos')?.invalid">
        <small>Este campo es obligatorio</small>
      </div>

      <button type="submit" class="btn-ingresar">Ingresar</button>
    </form>

    <div class="registro-info">
      <p>¿Primera vez aquí?</p>
      <a routerLink="/registro">Puedes crear una cuenta nueva</a>
    </div>
  </div>
</div>
