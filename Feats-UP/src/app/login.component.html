<div class="login-container">
  <div class="card">
    <a routerLink="/" class="volver">← Volver</a>
    <h2 class="titulo">Iniciar Sesión</h2>
    <p class="subtitulo">Accede a tu cuenta</p>

    <form>
      <label for="correo">Correo Electrónico</label>
      <input type="email" id="correo" placeholder="correo@ejemplo.com" />

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Tu nombre" />

      <label for="apellidos">Apellidos</label>
      <input type="text" id="apellidos" placeholder="Tus apellidos" />

      <button type="submit" class="btn-ingresar">Ingresar</button>
    </form>

    <div class="registro-info">
      <p>¿Primera vez aquí?</p>
      <a routerLink="/registro">Puedes crear una cuenta nueva</a>
    </div>
  </div>
</div>
